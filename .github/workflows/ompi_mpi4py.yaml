name: mpi4py

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      # Run both the OMPI-native and the MPI Standard ABI legs to
      # completion even if one fails.
      fail-fast: false
      matrix:
        include:
          # Native OMPI library: build without Fortran and test mpi4py
          # against libmpi (the historical behavior).
          - name: ompi
            extra_configure: --disable-mpi-fortran
            mpicc: mpicc
          # MPI Forum ABI: build libmpi_abi with the Fortran bindings
          # (so the optional Fortran datatypes are exercised) and build
          # mpi4py against the ABI wrapper compiler so it links libmpi_abi.
          - name: standard
            extra_configure: --enable-standard-abi
            mpicc: mpicc_abi
    env:
      MPI4PY_TEST_SPAWN: true
    steps:
    - name: Configure hostname
      run:  echo 127.0.0.1 `hostname` | sudo tee -a /etc/hosts > /dev/null
      if:   ${{ runner.os == 'Linux' || runner.os == 'macOS' }}

    - name: Install depencencies
      run:  sudo apt-get install -y -q
              libnuma-dev
      if:   ${{ runner.os == 'Linux' }}

    - name: Checkout Open MPI
      uses: actions/checkout@v6
      with:
       path: mpi-build
       submodules: recursive

    - name: Bootstrap Open MPI
      run:  AUTOMAKE_JOBS=$(nproc) ./autogen.pl
      working-directory: mpi-build

    # Install into a separate directory (/opt/openmpi) so that we can
    # bundle up that tree into an artifact to share with other jobs in
    # this github action.  Specifically don't use /usr/local, because
    # there's a bunch of other stuff already installed in /usr/local,
    # and we don't need to include that in our artifact.
    - name: Configure Open MPI
      run:  ./configure
              --disable-dependency-tracking
              --enable-debug
              --enable-mem-debug
              --disable-sphinx
              ${{ matrix.extra_configure }}
              --disable-oshmem
              --disable-silent-rules
              --prefix=/opt/openmpi
              LDFLAGS=-Wl,-rpath,/opt/openmpi/lib
      working-directory: mpi-build

    - name: Build MPI
      run:  make -j $(nproc)
      working-directory: mpi-build

    - name: Install MPI
      run:  sudo make install
      working-directory: mpi-build

    - name: Add Open MPI to PATH
      run: echo /opt/openmpi/bin >> $GITHUB_PATH

    - name: Tweak MPI
      run:  |
        # Tweak MPI
        mca_params="$HOME/.openmpi/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mpi_param_check = true >> "$mca_params"
        echo mpi_show_handle_leaks = true >> "$mca_params"
        mca_params="$HOME/.prte/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo rmaps_default_mapping_policy = :oversubscribe >> "$mca_params"
        #
        # Recent versions of OpenPMIx started emitting warnings about use of deprecated
        # MCA parameters its emission to stderr causes the demo/test-run stuff below to fail.
        # Suppress generation of these warnings.  A simpler CI test should be used to
        # to check for these messages.
        #
        mca_params="$HOME/.pmix/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mca_base_suppress_deprecated_warning = true >> "$mca_params"

    - name: Show MPI
      run:  ompi_info

    - name: Show MPICC
      run:  ${{ matrix.mpicc }} -show

    - name: Use Python
      uses: actions/setup-python@v5
      with:
        python-version: 3
        architecture: x64

    - name: Install Python packages (build)
      run:  python -m pip install --upgrade
              setuptools pip wheel

    - name: Install Python packages (test)
      run:  python -m pip install --upgrade
              numpy cffi pyyaml

    - name: Checkout mpi4py
      uses: actions/checkout@v6
      with:
        repository: mpi4py/mpi4py
        ref: master

    - name: Install mpi4py
      run:  python -m pip install .
      env:
        CFLAGS: "-O0"
        MPICC: ${{ matrix.mpicc }}

    - name: Debug spawn hang (watchdog + backtraces)
      timeout-minutes: 40
      run: |
        set +e
        sudo apt-get update -q > /dev/null && sudo apt-get install -y -q gdb > /dev/null
        which gdb || { echo "NO GDB"; exit 1; }
        echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
        dump() {
          ps -eo pid,ppid,stat,etime,cmd --forest | grep -v "ps -eo\|grep" | tail -40
          for p in $(pgrep -f "prterun|prted") $(for r in $(pgrep -f prterun); do pgrep -P $r; done); do
            echo "=================== PID $p: $(tr '\0' ' ' < /proc/$p/cmdline)"
            sudo gdb -p $p -batch -ex "thread apply all bt" 2>&1 | grep -v "^\[New LWP\|^$\|^\[Thread debugging\|libthread_db"
          done
        }
        for i in 1 2 3 4; do
          what="-x TestExcErrhandlerNull"
          case $i in
            1) mode=true;  btl=self,sm ;;
            2) mode=true;  btl=self,sm ;;
            3) mode=false; btl=self,sm ;;
            *) mode=true;  btl=self,sm,tcp ;;
          esac
          echo "##### iteration $i: group_connect=$mode btl=$btl $what"
          OMPI_MCA_btl=$btl OMPI_MCA_mpi_dpm_group_connect=$mode OMPI_MCA_btl_base_verbose=100 mpiexec -n 1 python test/main.py -v $what > run.log 2>&1 &
          pid=$!
          for t in $(seq 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          echo "----- iteration $i BTL choice per peer job (first 40 distinct):"
          grep -o "Using [a-z]* btl for send to \[\[[0-9]*,[0-9]*\],[0-9]*\] on node [^ ]*" run.log | sed "s/\[\[[0-9]*,\([0-9]*\)\],[0-9]*\]/job\1/" | sort | uniq -c | head -40
          echo "----- iteration $i hostname knowledge: $(grep -c 'on node unknown' run.log) unknown vs $(grep 'Using [a-z]* btl for send' run.log | grep -vc 'on node unknown') known"
          echo "----- iteration $i errors:"
          grep -i "unreachable\|not reach\|error\|FAIL" run.log | grep -v "ERRORS_\|errhandler\|Errhandler\|ErrorCode\|testError\|ErrorString\|ErrorClass\|error_" | head -15
          if kill -0 $pid 2>/dev/null; then
            echo "HANG in iteration $i"
            tail -4 run.log
            pkill -9 -f "python test/main.py"; pkill -9 -f spawn_child; pkill -9 -f prted; pkill -9 -f prte
            continue
          fi
          wait $pid; echo "exit=$?"; tail -2 run.log
        done
